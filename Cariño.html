<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Amor Anthuanet 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            text-align: center;
            padding: 50px;
            color: white;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            margin: auto;
            animation: fadeIn 2s ease-in-out;
            position: relative;
        }
        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff4e50;
        }
        p {
            font-size: 18px;
            color: #333;
        }
        .heart {
            font-size: 50px;
            color: red;
            animation: heartbeat 1.5s infinite;
            margin: 20px 0;
        }
        .btn {
            background: #ff4e50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background: #d43f3a;
        }
        .flowers {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
        }
        .photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4e50;
            margin-top: 10px;
        }
        .music {
            margin-top: 20px;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="flowers" src="https://cdn.pixabay.com/photo/2016/03/09/15/10/rose-1244635_960_720.png" alt="Flores">
        <h1>Para mi hermosa Anthuanet 💖</h1>
        <p>Eres mi felicidad, mi inspiración y mi razón de sonreír cada día. Te amo con todo mi corazón. 💕</p>
        <img class="photo" src="https://cdn.pixabay.com/photo/2015/03/03/18/58/avatar-657453_960_720.png" alt="Foto de Anthuanet">
        <div class="heart">❤️</div>
        <button class="btn" onclick="showLoveMessage()">Haz clic aquí</button>
        <div class="music">
            <audio controls autoplay>
                <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
                Tu navegador no soporta audio HTML5.
            </audio>
        </div>
    </div>
    <script>
        function showLoveMessage() {
            alert('Eres la persona más especial en mi vida, mi amor eterno. 💖');
        }
    </script>
</body>
</html>
